[package]
name = "webprint-client"
description = "webprint onsite print client: polls the server for jobs and sends them to the printer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "webprint-client"
path = "src/main.rs"

[dependencies]
# The test page is rendered locally; the grammars are not needed for that.
webprint-pdf = { path = "../webprint-pdf", default-features = false }
anyhow.workspace = true
clap.workspace = true
crossterm = "0.29"
ctrlc = "3"
# rustls with the ring provider: a pure-Rust TLS stack that needs no OpenSSL
# and no C toolchain, so the client still builds on Windows and Unix with
# nothing but cargo installed.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "charset", "query", "rustls-no-provider", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rpassword = "7"
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[target.'cfg(windows)'.dependencies]
# Prints through the Windows spooler directly, so no PDF helper application
# has to be installed next to the client.
printers = "2.3"
