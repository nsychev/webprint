[package]
name = "webprint-client"
description = "webprint client: polls the server for jobs and sends them to the printer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "webprint-client"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm = "0.29"
ctrlc = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "charset", "query", "rustls-no-provider", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rpassword = "7"
serde.workspace = true
serde_json.workspace = true
time.workspace = true
universal-print.workspace = true
tokio = { version = "1", default-features = false, features = ["rt"] }
